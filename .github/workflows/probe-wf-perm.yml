name: Probe Workflow Push Permission

# 探针 3（决定性）：ref 最终差异【非空】但【不含 workflow 改动】时，push 是否放行。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Probe non-empty diff without workflow changes
        run: |
          git config user.name "probe"
          git config user.email "probe@example.com"
          git checkout -B probe-branch3
          printf '# step1\n' > .github/workflows/_probe3.yaml
          git add -A
          git commit -m "simulate upstream: modify a workflow file"
          git rm -q .github/workflows/_probe3.yaml
          printf 'hello\n' > PROBE3-NOTES.txt
          git add -A
          git commit -m "tip: normal file change, no workflow change"
          echo "----- tip 与 master 的差异（应只有 PROBE3-NOTES.txt） -----"
          git diff --name-only origin/master HEAD; echo "[diff-end]"
          set +e
          git push -u origin probe-branch3 2>&1
          RC=$?
          set -e
          echo "----- push exit=$RC -----"
          exit $RC
